name: Sunday Telegram Reminder

on:
  schedule:
    # Every Sunday at 04:00 UTC = 09:00 AM Pakistan time (PKT, UTC+5)
    - cron: "0 4 * * 0"
  workflow_dispatch: # lets you run it manually from the Actions tab to test

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS --fail -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=NzR  bch ki DUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUa pul lo"
